[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fg_arag"
version = "0.1.0"
description = "Faithfulness-Gated Adaptive RAG"
authors = [
    {name = "AI Research Engineer"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "sentence-transformers>=2.2.0",
    "rank-bm25>=0.2.2",
    "chromadb>=0.4.0",
    "datasets>=2.14.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.0.0",
    "google-genai>=0.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort"
]
