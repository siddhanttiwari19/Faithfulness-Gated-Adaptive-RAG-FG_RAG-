dataset: "hotpotqa_distractor"
chunk_size: 256
chunk_overlap: 50
embedding_model: "BAAI/bge-base-en-v1.5"
reranker_model: "BAAI/bge-reranker-base"
nli_model: "microsoft/deberta-v3-large-mnli"
generator_model: "gemini-2.0-flash"
initial_top_k: 10
reretrieve_top_k: 20
rerank_top_r: 3
alpha: 0.7
lambda_contradiction: 0.5
tau_accept: 0.7  # DEVELOPMENT DEFAULT
tau_reject: 0.3  # DEVELOPMENT DEFAULT
temperature: 0.0
max_reretrieval_attempts: 1
max_regeneration_attempts: 1
seed: 42
device: "auto"
